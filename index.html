const DATA=[{"id": 0, "name": "Sverige", "sub": "Landets demokrati", "emoji": "🇸🇪", "topics": [{"title": "Grundlagarna", "text": "Sveriges fyra grundlagar är regeringsformen (RF), successionsordningen (SO), tryckfrihetsförordningen (TF) och yttrandefrihetsgrundlagen (YGL). RF beskriver hur Sverige styrs och vilka grundläggande fri- och rättigheter vi har. SO reglerar tronföljden. TF skyddar tryckta medier och YGL bland annat radio, tv och vissa digitala medier."}, {"title": "Demokrati och rättigheter", "text": "RF slår fast att all offentlig makt utgår från folket. Sverige har representativ demokrati: vi väljer politiker som fattar beslut. Allmän och lika rösträtt innebär att de röstberättigade har en röst var. Vissa rättigheter är absoluta och kan inte begränsas genom vanlig lag, medan andra får begränsas under särskilda villkor."}, {"title": "Ändra en grundlag", "text": "Riksdagen måste fatta två likalydande beslut med ett riksdagsval emellan för att ändra en grundlag. Det gör det svårare att snabbt ändra demokratins spelregler."}, {"title": "Statsministern och parlamentarism", "text": "Riksdagens talman föreslår en statsminister. Förslaget går igenom om inte minst 175 av riksdagens 349 ledamöter röstar nej. Parlamentarism innebär att regeringen måste tolereras av riksdagen. En misstroendeförklaring kan tvinga en minister eller regeringen att avgå."}, {"title": "Riksdagens kontroll", "text": "Konstitutionsutskottet (KU) granskar hur ministrarna sköter sina uppdrag. Riksdagen kan också ställa frågor och interpellationer, använda misstroendeförklaring och granska regeringens arbete genom andra kontrollorgan."}, {"title": "Budget, utskott och motioner", "text": "Regeringens förslag till statens budget kallas budgetproposition. Riksdagens utskott bereder ärenden och lämnar utskottsbetänkanden med förslag till beslut. En motion är ett förslag från riksdagsledamöter; den kan exempelvis komma från ett parti, en grupp eller en enskild ledamot. Riksdagsgrupper samordnar partiernas arbete."}], "questions": [{"q": "Vilken av följande är en svensk grundlag?", "opts": ["Kommunallagen", "Regeringsformen", "Skollagen", "Budgetlagen"], "correct": 1, "why": "Regeringsformen är en av Sveriges fyra grundlagar."}, {"q": "Vad skyddar tryckfrihetsförordningen främst?", "opts": ["Tryckta medier", "Arbetsmarknaden", "Kommunalskatten", "Val till EU"], "correct": 0, "why": "TF skyddar yttrandefriheten i tryckta skrifter."}, {"q": "Hur ändras normalt en grundlag?", "opts": ["Genom ett regeringsbeslut", "Genom en folkomröstning varje år", "Genom två riksdagsbeslut med val emellan", "Genom ett domstolsbeslut"], "correct": 2, "why": "Två likalydande beslut och ett riksdagsval emellan krävs."}, {"q": "Vem föreslår en ny statsminister?", "opts": ["Kungen", "Talmannen", "Justitieministern", "KU"], "correct": 1, "why": "Riksdagens talman lägger fram förslaget."}, {"q": "När godkänns talmannens statsministerförslag?", "opts": ["När minst 175 röstar ja", "När regeringen säger ja", "När färre än 175 röstar nej", "När alla partier är eniga"], "correct": 2, "why": "Det krävs att färre än 175 röstar nej."}, {"q": "Vad innebär parlamentarism?", "opts": ["Regeringen måste tolereras av riksdagen", "Domstolarna väljer regeringen", "Kungen bestämmer budgeten", "Kommunerna utser ministrar"], "correct": 0, "why": "Regeringen kan inte sitta kvar mot riksdagens majoritet."}, {"q": "Vad gör konstitutionsutskottet?", "opts": ["Väljer talman", "Granskar ministrarnas tjänsteutövning", "Fastställer kommunalskatten", "Leder domstolarna"], "correct": 1, "why": "KU granskar regeringens och statsrådens arbete."}, {"q": "Vad är en budgetproposition?", "opts": ["Kommunens årsredovisning", "Ett lagförslag från domstolen", "Regeringens förslag till statsbudget", "Ett förslag om grundlagsändring"], "correct": 2, "why": "Budgetpropositionen innehåller regeringens budgetförslag."}, {"q": "Vad är ett utskottsbetänkande?", "opts": ["Utskottets förslag till riksdagsbeslut", "En dom från Högsta domstolen", "En kommuns budget", "En ministerlista"], "correct": 0, "why": "Utskottet lämnar sitt förslag och sina överväganden i ett betänkande."}, {"q": "Vad betyder misstroendeförklaring?", "opts": ["Ett nytt val till kommunen", "En riksdagsomröstning om förtroendet för ett statsråd", "Ett presidentveto", "En opinionsundersökning"], "correct": 1, "why": "Riksdagen kan förklara att den saknar förtroende för ett statsråd."}]}, {"id": 1, "name": "Kommunen", "sub": "Beslut nära invånarna", "emoji": "🏛️", "topics": [{"title": "Kommunal självstyrelse", "text": "Kommunal självstyrelse innebär att kommunerna inom lagens ramar får fatta egna beslut om lokala angelägenheter och ta ut skatt. Självstyrelsen finns i regeringsformen. Kommunerna måste följa nationella lagar och tillämpliga EU-regler."}, {"title": "Obligatoriska uppgifter", "text": "Kommuner måste bland annat ansvara för skola, socialtjänst, äldreomsorg, vatten och avlopp, avfallshantering, räddningstjänst och viss samhällsplanering. Staten anger ramarna i lag."}, {"title": "Frivilliga uppgifter", "text": "Kommuner kan också välja att satsa på exempelvis fritidsanläggningar, kultur, turism och annan verksamhet av allmänt intresse. Kommuner får i regel inte ge otillbörligt stöd till enskilda företag, och verksamheten måste rymmas inom kommunens befogenheter."}, {"title": "Kommunfullmäktige", "text": "Kommunfullmäktige väljs av invånarna och är kommunens högsta beslutande organ. Fullmäktige bestämmer bland annat budget, kommunalskatt och övergripande mål."}, {"title": "Kommunstyrelsen och nämnderna", "text": "Kommunstyrelsen leder och samordnar kommunens arbete och följer upp ekonomin. Nämnderna ansvarar för olika verksamheter, till exempel skola och socialtjänst, och ser till att fullmäktiges beslut genomförs."}, {"title": "Fritidspolitiker och lokal påverkan", "text": "Många kommunpolitiker har ett annat arbete vid sidan av politiken och kallas fritidspolitiker. Invånarna kan påverka genom val, dialog och kontakt med förtroendevalda. Frågor om namngivna politiker och exakta antal mandat behöver kontrolleras mot aktuella kommunuppgifter."}], "questions": [{"q": "Vad betyder kommunal självstyrelse?", "opts": ["Kommunen får bestämma allt", "Kommunen får besluta lokalt inom lagens ramar", "Kommunen styr riksdagen", "Kommunen kan ignorera EU-regler"], "correct": 1, "why": "Kommunerna har eget beslutsutrymme men måste följa lagen."}, {"q": "Vilken uppgift är normalt obligatorisk för kommunen?", "opts": ["Utrikespolitik", "Försvar", "Grundskola", "Statliga universitet"], "correct": 2, "why": "Kommunen ansvarar för grundskoleverksamhet."}, {"q": "Vilken uppgift kan vara frivillig för kommunen?", "opts": ["Socialtjänst", "Avfallshantering", "Vatten och avlopp", "Turismsatsningar"], "correct": 3, "why": "Turism kan vara en frivillig kommunal verksamhet."}, {"q": "Vilket organ är kommunens högsta beslutande?", "opts": ["Kommunfullmäktige", "Kommunstyrelsen", "Skolnämnden", "Länsstyrelsen"], "correct": 0, "why": "Kommunfullmäktige är högsta beslutande organ."}, {"q": "Vem beslutar om kommunens budget?", "opts": ["Kommunstyrelsens ordförande ensam", "Kommunfullmäktige", "Riksdagens talman", "Regiondirektören"], "correct": 1, "why": "Fullmäktige beslutar om budget och skattesats."}, {"q": "Vad är kommunstyrelsens huvuduppgift?", "opts": ["Stifta rikslagar", "Döma i brottmål", "Leda och samordna kommunens arbete", "Välja statsminister"], "correct": 2, "why": "Kommunstyrelsen har lednings- och samordningsansvar."}, {"q": "Vad gör kommunala nämnder?", "opts": ["Ansvarar för särskilda kommunala verksamheter", "Bestämmer över presidenten", "Skriver grundlagar", "Styr alla regioner"], "correct": 0, "why": "Nämnder hanterar verksamheter inom sina områden."}, {"q": "Vad är en fritidspolitiker?", "opts": ["En politiker som arbetar enbart med fritid", "En politiker med annat huvudarbete vid sidan av politiken", "En politiker utan rösträtt", "En politiker i riksdagen"], "correct": 1, "why": "Fritidspolitiker har vanligen ett annat arbete som huvudsaklig sysselsättning."}, {"q": "Får en kommun ge stöd till vilket företag som helst?", "opts": ["Ja, alltid", "Ja, om företaget ber om det", "Nej, det finns begränsningar i kommunallagen", "Ja, utan beslut"], "correct": 2, "why": "Individuellt riktat stöd till företag är starkt begränsat."}, {"q": "Vad är ett exempel på ett lokalt beslut?", "opts": ["Sveriges försvarspolitik", "Internationella tullavtal", "Val av president", "Placering av kommunala fritidsanläggningar"], "correct": 3, "why": "Kommunen kan besluta om lokala anläggningar."}]}, {"id": 2, "name": "Ekonomin", "sub": "Skatt, utgifter och utjämning", "emoji": "📊", "topics": [{"title": "Kommunernas inkomster", "text": "Kommunalskatt är kommunernas viktigaste inkomstkälla. Andra inkomster är statsbidrag samt taxor och avgifter, exempelvis avgifter för vatten, avfall och vissa omsorgstjänster. Diagramuppgiften i PDF:en nämner 6 procent taxor och avgifter; själva diagrammet finns inte med."}, {"title": "Kommunalskatt och proportionell skatt", "text": "Kommunalskatten tas ut som en viss procent av den beskattningsbara inkomsten. Proportionell skatt innebär att procentsatsen är densamma inom den aktuella skatten även om beloppet i kronor ökar med inkomsten. Skattesatsen skiljer sig mellan kommuner och regioner."}, {"title": "Kommunernas utgifter", "text": "Stora kostnadsposter är skola, vård och omsorg samt socialtjänst. Hur kostnader förändrats mest över tid går inte att avgöra av den uppladdade frågelistan ensam."}, {"title": "Statsbidrag", "text": "Statsbidrag är pengar från staten till kommuner och regioner. De kan vara generella, som mottagaren får fördela inom sitt uppdrag, eller riktade till vissa ändamål."}, {"title": "Försörjningsbörda", "text": "Försörjningsbörda handlar om hur många som behöver försörjas i förhållande till dem som arbetar och bidrar med skatteintäkter. Befolkningens ålder och behov påverkar kommunens ekonomi."}, {"title": "Skatteutjämning och regioner", "text": "Det kommunalekonomiska utjämningssystemet ska ge kommuner och regioner mer likvärdiga ekonomiska förutsättningar trots skillnader i skattekraft och strukturella behov. Argument för är rättvis service; kritik kan handla om drivkrafter och omfördelning. Regionerna ansvarar framför allt för hälso- och sjukvård och regional utveckling."}], "questions": [{"q": "Vilken är kommunernas viktigaste inkomstkälla?", "opts": ["Kommunalskatten", "Böter", "Tullar", "Statliga lån"], "correct": 0, "why": "Kommunalskatten är den största inkomstkällan."}, {"q": "Vad betyder proportionell skatt?", "opts": ["Samma belopp i kronor för alla", "Samma procentsats på skatteunderlaget", "Högre procentsats för varje krona", "Ingen skatt på lön"], "correct": 1, "why": "Procentsatsen är densamma inom den proportionella skatten."}, {"q": "Vad är statsbidrag?", "opts": ["Lån från banker", "Avgifter från invånare", "Pengar från staten till kommuner och regioner", "Kommunala parkeringsböter"], "correct": 2, "why": "Statsbidrag är statliga medel."}, {"q": "Vilket är ett exempel på en kommunal avgift?", "opts": ["Importtull", "Bolagsskatt", "Statlig inkomstskatt", "Avgift för vatten och avlopp"], "correct": 3, "why": "Vatten- och avloppsavgifter är ett exempel."}, {"q": "Vad beskriver försörjningsbörda?", "opts": ["Förhållandet mellan försörjda och dem som arbetar", "Antalet kommunfullmäktigeledamöter", "Enbart kommunens låneskuld", "Enbart antalet företag"], "correct": 0, "why": "Begreppet handlar om försörjningsbehov i relation till den arbetande befolkningen."}, {"q": "Varför skiljer sig kommuners ekonomi?", "opts": ["Alla har exakt samma skattesats", "Befolkning och behov varierar", "Alla har samma kostnader", "Kommuner saknar skatteintäkter"], "correct": 1, "why": "Befolkningsstruktur, skattekraft och behov varierar."}, {"q": "Vad är huvudsyftet med skatteutjämningen?", "opts": ["Att avskaffa kommuner", "Att höja alla avgifter", "Att jämna ut ekonomiska förutsättningar", "Att finansiera presidentval"], "correct": 2, "why": "Utjämningen ska skapa mer likvärdiga förutsättningar."}, {"q": "Vad ansvarar regionerna främst för?", "opts": ["Grundlagar", "Utrikespolitik", "Nationellt försvar", "Hälso- och sjukvård"], "correct": 3, "why": "Hälso- och sjukvård är en central regional uppgift."}, {"q": "Vilken typ av statsbidrag är avsett för ett särskilt ändamål?", "opts": ["Riktat statsbidrag", "Generell kommunalskatt", "Vattenavgift", "Kommunal ränta"], "correct": 0, "why": "Riktade statsbidrag är öronmärkta för bestämda syften."}, {"q": "Vilken faktor kan öka kommunens omsorgskostnader?", "opts": ["Färre behov av stöd", "Fler äldre med omsorgsbehov", "Färre invånare med behov", "Lägre kostnad per insats"], "correct": 1, "why": "Fler personer med omsorgsbehov kan öka utgifterna."}]}, {"id": 3, "name": "USA", "sub": "President, kongress och delstater", "emoji": "🗽", "topics": [{"title": "Presidenten", "text": "USA:s president är statschef, leder den federala verkställande makten och är överbefälhavare. Presidenten väljs indirekt genom elektorssystemet för fyra år och får normalt väljas högst två gånger. Presidenten utser bland annat ministrar och nominerar domare till Högsta domstolen."}, {"title": "Veto och utrikespolitik", "text": "Presidenten kan lägga in veto mot lagförslag från kongressen. Kongressen kan upphäva ett vanligt veto med två tredjedelars majoritet i båda kamrarna. För vissa internationella fördrag krävs senatens godkännande med två tredjedelars majoritet."}, {"title": "Maktdelning", "text": "USA:s konstitution fördelar makten mellan presidenten (verkställande), kongressen (lagstiftande) och de federala domstolarna (dömande). Systemet ger institutionerna möjlighet att kontrollera varandra."}, {"title": "Kongressen", "text": "Kongressen består av representanthuset och senaten. Ledamöter i representanthuset väljs för två år och platserna fördelas efter delstaternas folkmängd. Varje delstat har två senatorer som väljs för sex år, med en tredjedel av senaten i val vartannat år."}, {"title": "Utskott och lobbyister", "text": "Kongressens utskott bereder politiska frågor och granskar förslag. Lobbyister företräder exempelvis företag och organisationer och försöker påverka politiska beslut."}, {"title": "Delstater och federalism", "text": "USA har 50 delstater med betydande självstyre. Federalism innebär att makten delas mellan den federala nivån och delstaterna. Delstaterna ansvarar bland annat för många utbildnings- och välfärdsfrågor. Varje delstat har en guvernör som leder den verkställande makten på delstatsnivå."}], "questions": [{"q": "Hur lång är en presidentmandatperiod i USA?", "opts": ["Två år", "Fyra år", "Sex år", "Åtta år"], "correct": 1, "why": "Presidenten väljs för fyra år."}, {"q": "Vad innebär presidentens veto?", "opts": ["Att avsätta domare", "Att upplösa delstater", "Att stoppa ett lagförslag om inte kongressen upphäver vetot", "Att själv ändra konstitutionen"], "correct": 2, "why": "Ett vanligt veto kan upphävas med två tredjedelar i båda kamrarna."}, {"q": "Vilka ingår i kongressen?", "opts": ["Senaten och representanthuset", "Presidenten och Högsta domstolen", "Guvernörerna och ministrarna", "Delstatsdomstolarna och presidenten"], "correct": 0, "why": "Kongressen har två kamrar."}, {"q": "Hur många senatorer har varje delstat?", "opts": ["En", "Tre", "Fyra", "Två"], "correct": 3, "why": "Varje delstat har två senatorer."}, {"q": "Hur lång är en senators mandatperiod?", "opts": ["Två år", "Sex år", "Fyra år", "Åtta år"], "correct": 1, "why": "Senatorer väljs för sex år."}, {"q": "Vad är federalism?", "opts": ["Att all makt finns hos presidenten", "Att domstolarna styr kommunerna", "Att makten delas mellan federal nivå och delstater", "Att inga regionala lagar finns"], "correct": 2, "why": "Federalism innebär maktdelning mellan nivåer."}, {"q": "Hur många delstater har USA?", "opts": ["50", "48", "52", "45"], "correct": 0, "why": "USA har 50 delstater."}, {"q": "Vad gör en lobbyist?", "opts": ["Väljer senatorer", "Leder Högsta domstolen", "Bestämmer delstatsskatt", "Försöker påverka politiska beslut"], "correct": 3, "why": "Lobbyister företräder intressen och försöker påverka beslutsfattare."}, {"q": "Vem leder den verkställande makten i en delstat?", "opts": ["Senatens talman", "Guvernören", "USA:s vicepresident", "Representanthusets talman"], "correct": 1, "why": "Guvernören är delstatens högsta verkställande ledare."}, {"q": "Vilken institution prövar konstitutionella frågor i USA?", "opts": ["Kongressens lobbyister", "Delstatsguvernörerna", "De federala domstolarna, ytterst Högsta domstolen", "Vita husets pressavdelning"], "correct": 2, "why": "Högsta domstolen har sista ordet i många konstitutionella tvister."}]}];

const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getStats(){try{return JSON.parse(localStorage.getItem('demokratikoll_stats')||'{}')}catch{return {}}}function saveStats(key,score,total){let s=getStats();s[key]={score,total,date:new Date().toLocaleDateString('sv-SE')};try{localStorage.setItem('demokratikoll_stats',JSON.stringify(s))}catch{}}
function getHistory(){try{return JSON.parse(localStorage.getItem('demokratikoll_history')||'{}')}catch{return {}}}
function recordCompletion(id,mode,score,total){let h=getHistory();let k=String(id);if(!h[k])h[k]={};let old=h[k][mode]||{attempts:0,perfect:0,best:0};h[k][mode]={attempts:old.attempts+1,perfect:old.perfect+(score===total?1:0),best:Math.max(old.best,score),total,last:score,date:new Date().toLocaleDateString('sv-SE')};try{localStorage.setItem('demokratikoll_history',JSON.stringify(h))}catch{}}
function progressLabel(id){let h=getHistory()[String(id)]||{};let labels={short:'Snabbquiz',practice:'Övningsquiz',test:'Testläge',all:'Alla frågor'};let entries=Object.entries(labels).filter(([k])=>h[k]);if(!entries.length)return '<p class="small">Inga quiz genomförda ännu.</p>';return `<div class="small" style="margin:12px 0;text-align:left"><b>Det här har du klarat:</b>${entries.map(([k,label])=>`<div style="margin-top:6px">${label}: bästa ${h[k].best}/${h[k].total}${h[k].perfect?` · Alla rätt ${h[k].perfect} ${h[k].perfect===1?'gång':'gånger'}`:''} · ${h[k].attempts} försök</div>`).join('')}</div>`}
function goHome(){state.view='home';render();scrollTo(0,0)}function openSubject(id){state.subject=id;state.view='subject';render();scrollTo(0,0)}function facts(){state.view='facts';render();scrollTo(0,0)}function chooseQuiz(){state.view='choose';render();scrollTo(0,0)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(mode,all=false){let q=all?DATA.flatMap(d=>d.questions.map(x=>({...x,source:d.name}))):DATA[state.subject].questions.map(x=>({...x,source:DATA[state.subject].name}));q=shuffle(q);if(mode==='short')q=q.slice(0,5);if(mode==='mixed')q=q.slice(0,20);state={...state,view:'quiz',questions:q.map(x=>{let opts=shuffle(x.opts.map((text,i)=>({text,correct:i===x.correct})));return {...x,answers:opts}}),index:0,score:0,answered:false,mode,wrong:[],choice:null};render();scrollTo(0,0)}
function answer(i){if(state.answered)return;state.answered=true;state.choice=i;let q=state.questions[state.index];if(q.answers[i].correct)state.score++;else state.wrong.push(q);render()}
function next(){state.index++;state.answered=false;state.choice=null;if(state.index>=state.questions.length){state.view='result';if(state.mode!=='mixed')recordCompletion(state.subject,state.mode,state.score,state.questions.length);saveStats(state.mode==='mixed'?'mixed':String(state.subject),state.score,state.questions.length)}render();scrollTo(0,0)}
function render(){let d=DATA[state.subject],s=getStats();if(state.view==='home'){app.innerHTML=`<section class="hero"><span class="pill">SO · SAMHÄLLSKUNSKAP</span><h1>Lär dig hur demokratin fungerar.</h1><p>Läs tydliga faktagenomgångar, öva på frågor och testa dina kunskaper om Sverige, kommunerna, ekonomin och USA.</p><button class="btn" onclick="startQuiz('mixed',true)">Starta blandat slutprov →</button></section><div class="grid">${DATA.map(x=>`<button class="tile" onclick="openSubject(${x.id})"><div class="emoji">${x.emoji}</div><h2>Så styrs ${x.name==='Ekonomin'?'den kommunala ekonomin':x.name==='Kommunen'?'kommunen':x.name}</h2><p>${esc(x.sub)}</p><span class="pill">${x.topics.length} faktadelar · ${x.questions.length} frågor</span>${progressLabel(x.id)}${s[x.id]?`<p class="small">Senaste resultat: ${s[x.id].score}/${s[x.id].total}</p>`:''}<footer>Öppna området →</footer></button>`).join('')}</div><p class="small" style="margin-top:24px">Resultat sparas endast i den här webbläsaren på din enhet.</p>`;return}
if(state.view==='subject'){app.innerHTML=`<span class="crumb" onclick="goHome()">← Alla områden</span><div class="panel"><span class="pill">${d.emoji} ${esc(d.name)}</span><h1>${esc(d.sub)}</h1><p class="muted">Välj om du vill läsa fakta eller träna med quiz.</p><div class="actions"><button class="btn" onclick="facts()">📖 Läs fakta</button><button class="btn secondary" onclick="chooseQuiz()">🧠 Gör quiz</button></div>${progressLabel(d.id)}${s[d.id]?`<p class="small">Senaste quizresultat: ${s[d.id].score} av ${s[d.id].total} rätt (${s[d.id].date})</p>`:''}</div>`;return}
if(state.view==='facts'){app.innerHTML=`<span class="crumb" onclick="openSubject(${d.id})">← ${esc(d.name)}</span><div class="panel"><span class="pill">Faktagenomgång</span><h1>${esc(d.name)}</h1><p class="muted">Tryck på en rubrik för att läsa. Du kan ha flera delar öppna samtidigt.</p>${d.topics.map((t,i)=>`<details class="topic" ${i===0?'open':''}><summary>${i+1}. ${esc(t.title)}</summary><p>${esc(t.text)}</p></details>`).join('')}<div class="actions"><button class="btn" onclick="chooseQuiz()">Testa vad du lärt dig →</button></div></div>`;return}
if(state.view==='choose'){app.innerHTML=`<span class="crumb" onclick="openSubject(${d.id})">← ${esc(d.name)}</span><div class="panel"><h1>Quiz: ${esc(d.name)}</h1><p class="muted">Frågorna och svarsalternativen blandas varje gång. I övningsläget får du förklaring direkt.</p><div class="mode"><button class="btn secondary" onclick="startQuiz('short')">Snabbquiz · 5 frågor</button><button class="btn" onclick="startQuiz('practice')">Övningsquiz · 10 frågor</button><button class="btn ghost" onclick="startQuiz('test')">Testläge · 10 frågor</button><button class="btn" onclick="startQuiz('all')">Alla frågor · 10 frågor</button></div><p class="small">På startsidan visas vilka quiz du gjort, ditt bästa resultat och hur många gånger du fått alla rätt. Resultaten sparas lokalt i webbläsaren.</p></div>`;return}
if(state.view==='quiz'){let q=state.questions[state.index],isTest=state.mode==='test'||state.mode==='mixed'||state.mode==='all';app.innerHTML=`<span class="crumb" onclick="${state.mode==='mixed'?'goHome()':'chooseQuiz()'}">← Avsluta quiz</span><div class="panel"><span class="pill">${esc(q.source)} · ${isTest?'Testläge':'Övning'}</span><div class="progress"><div style="width:${100*(state.index+1)/state.questions.length}%"></div></div><p class="small">Fråga ${state.index+1} av ${state.questions.length} · ${state.score} rätt hittills</p><h2>${esc(q.q)}</h2>${q.answers.map((o,i)=>`<button class="option ${state.answered&&!isTest?(o.correct?'good':state.choice===i?'bad':''):''}" ${state.answered?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(o.text)}</button>`).join('')}${state.answered?`<div class="feedback">${isTest?'Svaret är registrerat.':`<b>${q.answers[state.choice].correct?'Rätt svar!':'Inte riktigt.'}</b> ${esc(q.why)}`}</div><div class="actions"><button class="btn" onclick="next()">${state.index===state.questions.length-1?'Visa resultat':'Nästa fråga →'}</button></div>`:''}</div>`;return}
if(state.view==='result'){let total=state.questions.length;let missed=state.wrong;app.innerHTML=`<div class="panel center"><span class="pill">Quiz avslutat</span><h1>Ditt resultat</h1><div class="score">${state.score} / ${total}</div><h2>${Math.round(100*state.score/total)} % rätt</h2><p class="muted">${state.score===total?'Alla rätt! Det visas nu på startsidan.':state.score>=total*.7?'Bra jobbat! Repetera gärna frågorna du missade.':'Läs igenom faktadelarna och försök igen.'}</p><div class="actions" style="justify-content:center"><button class="btn" onclick="${state.mode==='mixed'?"startQuiz('mixed',true)":`startQuiz('${state.mode}')`}">Gör om quiz</button><button class="btn secondary" onclick="goHome()">Till startsidan</button></div></div>${missed.length?`<div class="panel" style="margin-top:20px"><h2>Repetera de frågor du missade</h2>${missed.map(x=>`<details class="topic"><summary>${esc(x.q)}</summary><p><b>Rätt svar:</b> ${esc(x.opts[x.correct])}<br>${esc(x.why)}</p></details>`).join('')}</div>`:''}`;return}}
render();</script></body></html>
